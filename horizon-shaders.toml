schema = 1
id = "kefs_shader"
name = "Kefs Shader"
version = "0.7.2"
api = "0.1"
description = "Kefs unified shader: water, lighting, shadows, biome atmosphere, underwater effects, bloom, directional glare and volumetric-style shafts."
authors = ["VEKIIXX"]
license = "Licença Aberta de Propriedade Contínua - kefs simplicity shader"
shared = ["options.wgsl", "common.wgsl", "water_lib.wgsl", "sky_lib.wgsl"]

[sky]
file = "sky.wgsl"

[material]
file = "material.wgsl"

[vertex]
file = "vertex.wgsl"

[shadow]
resolution = 1024
distance = 48.0

[[post]]
file = "outline.wgsl"
name = "Outlines"

[[post]]
file = "grade.wgsl"
name = "Atmosphere, tonemap and grade"

[[textures]]
id = "water_pixel"
file = "water_pixel.png"
filter = "nearest"
wrap = "clamp"

[[textures]]
id = "leaf"
file = "leaf.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "sparkle"
file = "sparkle.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "smoke"
file = "smoke.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "bubble"
file = "bubble.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "rune"
file = "rune.png"
filter = "linear"
wrap = "clamp"

[[lights]]
color = [1.0, 0.6, 0.25]
blocks = ["torch", "wall_torch", "lantern", "campfire", "fire", "furnace", "blast_furnace", "smoker", "jack_o_lantern", "ochre_froglight", "pearlescent_froglight", "verdant_froglight"]

[[lights]]
color = [0.3, 0.7, 1.0]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire", "soul_fire"]

[[lights]]
color = [1.0, 0.35, 0.15]
blocks = ["lava", "lava_cauldron", "magma_block"]

[[lights]]
color = [0.85, 0.55, 1.0]
blocks = ["amethyst_cluster", "budding_amethyst", "end_rod", "crying_obsidian", "respawn_anchor"]

[[lights]]
color = [1.0, 0.9, 0.55]
blocks = ["glowstone", "shroomlight", "sea_lantern", "beacon", "copper_bulb", "exposed_copper_bulb", "weathered_copper_bulb", "oxidized_copper_bulb"]

[budget]
gpu_ms = 2.0

[[materials]]
id = 1
sprites = ["block/*_leaves"]

[[materials]]
id = 2
sprites = [
  "block/short_grass", "block/fern", "block/dead_bush", "block/dandelion", "block/poppy",
  "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley",
  "block/blue_orchid", "block/allium", "block/azure_bluet", "block/wheat_stage*",
]

[[materials]]
id = 3
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom", "block/lilac_bottom", "block/rose_bush_bottom", "block/peony_bottom", "block/sunflower_bottom"]

[[materials]]
id = 4
sprites = ["block/tall_grass_top", "block/large_fern_top", "block/lilac_top", "block/rose_bush_top", "block/peony_top", "block/sunflower_top"]

[[materials]]
id = 5
sprites = ["block/kelp", "block/kelp_plant"]

[[materials]]
id = 6
sprites = ["block/seagrass"]

[[materials]]
id = 7
sprites = ["block/tall_seagrass_bottom"]

[[materials]]
id = 8
sprites = ["block/tall_seagrass_top"]

[[materials]]
id = 9
sprites = ["block/nether_portal*"]

# ---------------- Colour ----------------
[[options]]
id = "tonemap_op"
name = "Tonemap"
type = "choice"
values = ["Off", "ACES", "Reinhard-Jodie", "PBR Neutral+", "Hejl 2015", "Lottes"]
default = "PBR Neutral+"

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.15
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.25
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "vibrance"
name = "Vibrance"
type = "float"
default = 0.30
min = -0.5
max = 1.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.08
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "gamma_adjust"
name = "Gamma"
type = "float"
default = 1.05
min = 0.7
max = 1.3
step = 0.05

[[options]]
id = "scene_light"
name = "Highlights / shadows grade"
type = "float"
default = 0.0
min = -1.0
max = 1.0
step = 0.05

[[options]]
id = "purkinje"
name = "Night colour shift"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "toon_light"
name = "Toon light bands"
type = "float"
default = 0.40
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "sun_warmth"
name = "Warm sun / cool shade"
type = "float"
default = 1.15
min = 0.0
max = 2.0
step = 0.25

[[options]]
id = "split_tone"
name = "Cool shadows / warm lights"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "bloom_on"
name = "Bloom"
type = "bool"
default = false

[[options]]
id = "bloom_strength"
name = "Bloom strength"
type = "float"
default = 1.20
min = 0.1
max = 4.0
step = 0.1

[[options]]
id = "bloom_masks"
name = "Selective bloom (emissive blocks)"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

# ---------------- Outlines ----------------
[[options]]
id = "outlines"
name = "Outlines"
type = "bool"
default = true

[[options]]
id = "outline_strength"
name = "Outline strength"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "outline_thickness"
name = "Outline thickness"
type = "int"
default = 1
min = 1
max = 4

[[options]]
id = "outline_look"
name = "Outline colour and fade"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "outline_range"
name = "Outline range (blocks)"
type = "float"
default = 120.0
min = 30.0
max = 300.0
step = 10.0

# ---------------- Water ----------------
[[options]]
id = "water_style"
name = "Water style"
type = "choice"
values = ["Anime (Voronoi)", "Pixel (Atlas)"]
default = "Pixel (Atlas)"

[[options]]
id = "water_motion"
name = "Water motion"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_shore"
name = "Water shoreline"
type = "bool"
default = true

[[options]]
id = "water_shore_width"
name = "Shoreline width"
type = "float"
default = 1.0
min = 0.4
max = 2.5
step = 0.1

# ---------------- Lighting ----------------
[[options]]
id = "rim_light"
name = "Rim light"
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "subsurface"
name = "Leaf and grass backlight"
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "sun_specular"
name = "Sun glint on stone and wood"
type = "float"
default = 0.4
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "vanilla_shadows"
name = "Vanilla shadows (0 = off)"
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

# ---------------- Atmosphere ----------------
[[options]]
id = "cave_dust"
name = "Cave dust"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "underwater"
