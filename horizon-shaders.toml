[[options]]
id = "nether_fog"
name = "Nether fog and ash"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "desert_atmo"
name = "Horizon warmth and desert dust"
type = "float"
default = 1.0
min = 0.0
