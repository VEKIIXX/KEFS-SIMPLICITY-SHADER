[[options]]
id = "aurora"
name = "Aurora (night sky)"
type = "float"
default = 0.7
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "wind_plants"
name = "Plant sway (grass, flowers, leaves)"
type = "float"
default = 1.0
